version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - exhaustive
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        # Enum constants and String/Marshal methods are self-describing.
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/storskegg/go-geomancer
